<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmolLM2 Chat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #00d4aa;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #chat {
            height: 450px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            background: #16162a;
            margin-bottom: 16px;
        }
        .msg {
            margin: 12px 0;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user {
            background: linear-gradient(135deg, #0066cc, #0052a3);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant {
            background: #2a2a4a;
            color: #ddd;
            border-bottom-left-radius: 4px;
        }
        .system {
            background: #3a3a5a;
            color: #999;
            font-size: 0.9em;
            max-width: 95%;
        }
        .generating {
            color: #888;
            font-style: italic;
        }
        .generating::after {
            content: ' ░';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        #input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        #input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #333;
            border-radius: 12px;
            font-size: 16px;
            background: #1a1a2e;
            color: #eee;
            outline: none;
            transition: border-color 0.2s;
        }
        #input:focus {
            border-color: #00d4aa;
        }
        #input::placeholder {
            color: #666;
        }
        #send {
            padding: 14px 28px;
            background: linear-gradient(135deg, #00d4aa, #00a088);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        #send:hover {
            transform: scale(1.02);
        }
        #send:active {
            transform: scale(0.98);
        }
        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #settings {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px;
            background: #16162a;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .setting {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting label {
            color: #888;
            font-size: 14px;
        }
        .setting input {
            width: 80px;
            padding: 6px 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
            text-align: center;
        }
        .setting select {
            padding: 6px 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
        }
        .error {
            color: #ff6b6b;
            padding: 12px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            margin: 12px 0;
        }
        .info {
            color: #888;
            font-size: 13px;
            text-align: center;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <h1>SmolLM2 Chat</h1>
    <p class="subtitle">Lightweight 135M parameter language model</p>

    <div id="settings">
        <div class="setting">
            <label>Temperature</label>
            <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
        </div>
        <div class="setting">
            <label>Max Tokens</label>
            <input type="number" id="maxTokens" value="256" min="1" max="2048" step="64">
        </div>
        <div class="setting">
            <label>Top-P</label>
            <input type="number" id="topP" value="90" min="0" max="100">
        </div>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <input type="text" id="input" placeholder="Type your message..." autofocus>
        <button id="send" onclick="sendMessage()">Send</button>
    </div>

    <p class="info">Press Enter to send • Supports multi-line input</p>

    <script>
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const tempInput = document.getElementById('temperature');
        const maxTokensInput = document.getElementById('maxTokens');
        const topPInput = document.getElementById('topP');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function sendMessage() {
            const msg = input.value.trim();
            if (!msg) return;

            const temperature = parseFloat(tempInput.value) || 0.7;
            const maxTokens = parseInt(maxTokensInput.value) || 256;
            const topP = parseFloat(topPInput.value) || 90;

            // Add user message
            chatDiv.innerHTML += `<div class="msg user">${escapeHtml(msg)}</div>`;
            input.value = '';
            sendBtn.disabled = true;
            scrollToBottom();

            // Add placeholder for assistant
            const assistantDiv = document.createElement('div');
            assistantDiv.className = 'msg assistant generating';
            assistantDiv.textContent = 'Generating...';
            chatDiv.appendChild(assistantDiv);
            scrollToBottom();

            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: msg }],
                        temperature: temperature,
                        max_tokens: maxTokens,
                        top_p: topP
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    // Parse SSE events
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('event: token\ndata: ')) {
                            try {
                                const jsonStr = line.substring('event: token\ndata: '.length);
                                const data = JSON.parse(jsonStr);
                                fullResponse += data.text || '';
                                assistantDiv.textContent = fullResponse;
                                scrollToBottom();
                            } catch (e) {
                                // Skip malformed JSON
                            }
                        } else if (line.startsWith('event: done\ndata: ')) {
                            try {
                                const jsonStr = line.substring('event: done\ndata: '.length);
                                const data = JSON.parse(jsonStr);
                                assistantDiv.textContent = fullResponse || data.text || fullResponse;
                            } catch (e) {
                                assistantDiv.textContent = fullResponse;
                            }
                            assistantDiv.classList.remove('generating');
                        }
                    }
                }

                if (assistantDiv.classList.contains('generating')) {
                    assistantDiv.textContent = fullResponse || 'No response';
                    assistantDiv.classList.remove('generating');
                }

            } catch (err) {
                assistantDiv.textContent = 'Error: ' + err.message;
                assistantDiv.style.color = '#ff6b6b';
                assistantDiv.classList.remove('generating');
            }

            sendBtn.disabled = false;
            input.focus();
            scrollToBottom();
        }

        // Enter to send
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus input on load
        input.focus();
    </script>
</body>
</html>
